<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Pagos - Candela Larragneguy</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-dark: #1B4D7D;
            --primary-light: #2A6FB3;
            --secondary: #4A5568;
            --accent-gold: #D4A574;
            --accent-green: #20A39E;
            --light-bg: #F5F7FA;
            --white: #FFFFFF;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #E8ECEF 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(27, 77, 125, 0.3);
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border-top: 5px solid var(--accent-gold);
        }
        .login-card .firma-profesional {
            font-size: 22px;
            color: var(--primary-dark);
            font-weight: 700;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        .login-card .titulo-profesional {
            font-size: 14px;
            color: var(--secondary);
            font-weight: 600;
            margin-bottom: 30px;
        }
        .login-card p {
            color: var(--secondary);
            margin-bottom: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-screen">
    <div class="login-card">
        <div class="firma-profesional">Candela Larragneguy<br>Contadora Pública</div>
        <div class="titulo-profesional">Consultoría y Gestión Empresarial</div>
        <p>Accede de forma segura con tu cuenta de Google</p>
        <div id="g_id_onload"
             data-client_id="245604969675-k53tl31tugp76q72vj3k3ckio8qcn9ej.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div id="g_id_signin" data-type="standard"></div>
        <p style="margin-top: 20px; font-size: 11px;">Tus datos están protegidos y seguros con Google</p>
    </div>
</div>

<script>
function handleCredentialResponse(response) {
    alert('✓ Sesión iniciada. El calendario se cargará en breve.');
    console.log('Usuario autenticado:', response);
}

window.onload = function () {
    google.accounts.id.initialize({
        client_id: '245604969675-k53tl31tugp76q72vj3k3ckio8qcn9ej.apps.googleusercontent.com',
        callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
        document.getElementById('g_id_signin'),
        { theme: 'outline', size: 'large' }
    );
}
</script>

</body>
</html>
